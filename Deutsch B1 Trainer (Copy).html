<!DOCTYPE html>
<html lang="de">

<title>Deutsch B1 Trainer (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F2F5F0;
  --surface: #FFFFFF;
  --surface-2: #E9EEE8;
  --ink: #17211B;
  --muted: #5C6A61;
  --line: #D5DDD6;
  --accent: #1E6F4A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEE3;
  --warn: #A9701A;
  --warn-soft: #FBEFD9;
  --bad: #B23B3B;
  --bad-soft: #F8E1E1;
  --focus: #1E6F4A;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #182019; --surface-2: #1F2A22; --ink: #E6EDE7; --muted: #9AA79E;
    --line: #2A362E; --accent: #6CCB95; --accent-ink: #0F1613; --accent-soft: #1E3A2A;
    --warn: #E0A84A; --warn-soft: #3A2E14; --bad: #E07070; --bad-soft: #3D1C1C; --focus: #6CCB95;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #182019; --surface-2: #1F2A22; --ink: #E6EDE7; --muted: #9AA79E;
  --line: #2A362E; --accent: #6CCB95; --accent-ink: #0F1613; --accent-soft: #1E3A2A;
  --warn: #E0A84A; --warn-soft: #3A2E14; --bad: #E07070; --bad-soft: #3D1C1C; --focus: #6CCB95;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
}
img { max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.app { max-width: 720px; margin: 0 auto; padding: 14px 16px 110px; }
@media (min-width: 760px) { .app { padding: 24px 24px 60px; } }

/* header */
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.head h1 { font-family: var(--serif); font-weight: 600; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
.head .exam { font-size: 0.9rem; color: var(--muted); text-align: right; }
.head .exam strong { color: var(--ink); font-weight: 600; }
.head .exam button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 0.85rem; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; }
.nav button { flex: 1; background: none; border: 0; padding: 6px 2px; font-size: 0.72rem; font-weight: 500; color: var(--muted); border-radius: 8px; line-height: 1.2; }
.nav button .ic { display: block; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; color: var(--muted); margin-bottom: 1px; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] .ic { color: var(--accent); }
@media (min-width: 760px) {
  .nav { position: static; border: 0; border-bottom: 1px solid var(--line); padding: 0; margin: 4px 0 20px; background: transparent; gap: 4px; }
  .nav button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; padding: 10px 12px; border-radius: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .nav button .ic { font-size: 1.05rem; margin: 0; }
  .nav button[aria-current="page"] { border-bottom-color: var(--accent); }
}

/* generic */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; margin: 0 0 6px; }
.card h3 { font-size: 0.95rem; font-weight: 600; margin: 14px 0 6px; }
.card h3:first-child { margin-top: 0; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 0.95rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.warn { background: var(--warn-soft); color: var(--ink); border-color: var(--warn-soft); }
.btn.sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 8px; }
.btn.wide { width: 100%; }
.chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; background: var(--surface-2); color: var(--muted); border: 1px solid transparent; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
button.chip { cursor: pointer; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; }
.pill.akk { background: var(--accent-soft); color: var(--accent); }
.pill.dat { background: var(--warn-soft); color: var(--warn); }
.pill.weak { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.divider { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); font-family: var(--serif); font-size: 1.05rem; line-height: 1.55; }
input[type="text"], input[type="date"], select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* drill */
.drill .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
.sentence { font-family: var(--serif); font-size: 1.55rem; line-height: 1.55; margin: 6px 0 18px; }
@media (max-width: 400px) { .sentence { font-size: 1.35rem; } }
.sentence input.gap {
  font: inherit; width: 4.8ch; min-width: 4.8ch; border: 0; border-bottom: 2px solid var(--accent); background: transparent;
  text-align: center; color: var(--ink); padding: 0 2px; border-radius: 0; margin: 0 2px;
}
.sentence .gapword { border-bottom: 2px solid var(--accent); padding: 0 4px; font-weight: 600; }
.sentence .gapword.wrong { border-bottom-color: var(--bad); text-decoration: line-through; text-decoration-color: var(--bad); font-weight: 400; }
.sentence .gapword.right { color: var(--accent); }
.hint { font-size: 0.95rem; color: var(--muted); margin-bottom: 12px; }
.fb { border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: 0.95rem; }
.fb.good { background: var(--accent-soft); }
.fb.bad { background: var(--bad-soft); }
.fb.note { background: var(--surface-2); }
.fb .big { font-family: var(--serif); font-size: 1.2rem; margin-bottom: 6px; }
.fb dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 0.9rem; }
.fb dt { color: var(--muted); }
.fb dd { margin: 0; }
.opts { display: grid; gap: 8px; margin: 10px 0; }
.opts button { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: var(--serif); font-size: 1.1rem; }
.opts button:hover { border-color: var(--ink); }
.opts button.right { background: var(--accent-soft); border-color: var(--accent); }
.opts button.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opts button:disabled { cursor: default; }
.explain { font-size: 0.95rem; }
.kw { font-family: var(--serif); font-weight: 600; }

/* lists */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
.item:first-child { border-top: 0; }
.item .de { font-family: var(--serif); font-size: 1.1rem; }
.item .en { color: var(--muted); font-size: 0.9rem; grid-column: 1 / -1; }
.item .ex { font-family: var(--serif); font-size: 1rem; grid-column: 1 / -1; color: var(--ink); margin-top: 2px; }
.item .ex b { color: var(--accent); font-weight: 600; }
details { border-top: 1px solid var(--line); padding: 8px 0; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; list-style: none; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 1.2rem; }
details[open] summary::after { content: "–"; }
.phrases { margin: 6px 0 4px; padding: 0; list-style: none; }
.phrases li { font-family: var(--serif); font-size: 1.05rem; padding: 5px 0 5px 12px; border-left: 2px solid var(--accent-soft); margin: 4px 0; }
.phrases li.head { border-left: 0; padding-left: 0; font-family: var(--sans); font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
.steps { counter-reset: s; margin: 0; padding: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(s); font-family: var(--serif); font-weight: 600; color: var(--accent); font-size: 1.15rem; }
.steps b { display: block; }
.steps span { font-family: var(--serif); color: var(--muted); }

/* stats */
.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.stat:first-child { border-top: 0; }
.stat .n { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; }
.stat .bar { grid-column: 1 / -1; }
.bignum { font-family: var(--serif); font-size: 2.6rem; font-weight: 600; line-height: 1; }

/* writing */
.out { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.55; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 40px; }
.out:empty { display: none; }
.wrap { overflow-x: auto; }
.tabs2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.empty { color: var(--muted); padding: 12px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 0.85rem; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (min-width: 760px) { .toast { bottom: 24px; } }
</style>
</head>

// wo-/da-forms
function woForm(prep) { return (/^[aeiouäöü]/.test(prep) ? "wor" : "wo") + prep; }
function daForm(prep) { return (/^[aeiouäöü]/.test(prep) ? "dar" : "da") + prep; }
function personQ(v) { return v.prep.charAt(0).toUpperCase() + v.prep.slice(1) + " " + (v.kase === "A" ? "wen" : "wem") + "?"; }

// ---------- STATE & PROGRESS ----------
const LS_KEY = "b1trainer.progress.v1";
const DEFAULT_EXAM = "2026-10-15";
function freshProgress() { return { v: 1, updatedAt: 0, examDate: DEFAULT_EXAM, items: {}, days: {}, writes: 0 }; }
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const p = JSON.parse(raw); if (p && p.items) return Object.assign(freshProgress(), p); } } catch (e) {}
  return freshProgress();
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.progress)); } catch (e) {} }

const state = { tab: "verben", sub: {}, progress: loadLocal(), db: null, dbRef: null, sample: null, sampleTried: false, session: null, prev: {}, writing: null, dirty: false, saveTimer: null, ctl: null };

function todayKey() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function touch() { state.progress.updatedAt = Date.now(); saveLocal(); scheduleDbSave(); }
function recordAnswer(id, ok) {
  const it = state.progress.items[id] || { c: 0, w: 0 };
  if (ok) it.c++; else it.w++;
  it.last = Date.now(); it.ok = !!ok;
  state.progress.items[id] = it;
  const t = todayKey(); const d = state.progress.days[t] || { n: 0, r: 0 };
  d.n++; if (ok) d.r++; state.progress.days[t] = d;
  touch();
}
function stat(id) { return state.progress.items[id]; }
function isWeak(id) { const s = stat(id); return !!s && (s.ok === false || s.w >= s.c); }
function isKnown(id) { const s = stat(id); return !!s && s.ok === true && s.c >= 2 && s.c > s.w; }

// db sync (progress across devices)
function scheduleDbSave() { clearTimeout(state.saveTimer); state.saveTimer = setTimeout(dbSave, 1500); }
async function dbSave() {
  if (!state.dbRef) return;
  if (state.writing) { state.dirty = true; return; }
  state.writing = state.dbRef.set(JSON.parse(JSON.stringify(state.progress))).catch(() => {}).finally(() => { state.writing = null; if (state.dirty) { state.dirty = false; dbSave(); } });
}
async function initDb() {
  let db = null;
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  state.db = db; state.dbRef = db.doc("progress/main");
  try {
    const snap = await state.dbRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.updatedAt || 0) > (state.progress.updatedAt || 0)) { state.progress = Object.assign(freshProgress(), remote); saveLocal(); render(); toast("Fortschritt vom anderen Gerät geladen"); }
      else if ((state.progress.updatedAt || 0) > (remote.updatedAt || 0)) { dbSave(); }
    } else if (state.progress.updatedAt) { dbSave(); }
  } catch (e) {}
}
async function initSample() {
  try { state.sample = await claude.use("sample"); } catch (e) { state.sample = null; }
  state.sampleTried = true;
  if (state.tab === "schreiben") render();
}
if (window.claude && typeof window.claude.use === "function") { initDb(); initSample(); } else { state.sampleTried = true; }

// ---------- HELPERS ----------
const $ = (s, r) => (r || document).querySelector(s);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function mark(s) { return esc(s).replace(/\*([^*]+)\*/g, "<b>$1</b>"); }
function norm(s) { return String(s || "").trim().toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function nl(s) { return esc(s).replace(/\n/g, "<br>"); }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }
function daysLeft() {
  const d = new Date((state.progress.examDate || DEFAULT_EXAM) + "T00:00:00");
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((d - now) / 864e5);
}
// choose a session of n ids: weak first, then unseen, then the rest (least recently seen)
function buildSession(ids, n, weakOnly) {
  if (weakOnly) { const w = shuffle(ids.filter(isWeak)); return w.slice(0, n); }
  const weak = shuffle(ids.filter(isWeak));
  const unseen = shuffle(ids.filter(id => !stat(id)));
  const rest = ids.filter(id => stat(id) && !isWeak(id)).sort((a, b) => (stat(a).last || 0) - (stat(b).last || 0));
  const out = [];
  const take = (arr, k) => { for (const id of arr) { if (out.length >= n || k <= 0) break; if (!out.includes(id)) { out.push(id); k--; } } };
  take(weak, Math.min(weak.length, Math.ceil(n / 2)));
  take(unseen, n - out.length);
  take(shuffle(rest.slice(0, n * 2)), n - out.length);
  take(weak, n - out.length);
  return shuffle(out);
}

  } else {
    const okCls = s.prepOk ? "right" : "wrong";
    html += `<div class="sentence">${esc(parts[0])}${s.prepOk ? "" : `<span class="gapword wrong">${esc(s.given || "—")}</span> `}<span class="gapword right">${esc(v.prep)}</span>${esc(parts[1])}</div>`;
    if (s.stage === "case") {
      html += `<div class="hint">${s.prepOk ? "Richtig. " : `Die Präposition ist <b>${esc(v.prep)}</b>. `}Und welcher Kasus?</div>
        <div class="opts"><button data-act="vCase" data-arg="A">Akkusativ</button><button data-act="vCase" data-arg="D">Dativ</button></div>`;
    } else {
      const ok = s.prepOk && s.caseOk;

function verbList() {
  const f = state.sub.vFilter || "alle";
  const preps = [...new Set(VERBS.map(v => v.prep))].sort();
  let html = `<div class="row" style="margin-bottom:10px">${["alle", "schwach", ...preps].map(p => `<button class="chip ${f === p ? "on" : ""}" data-act="vFilter" data-arg="${p}">${p}</button>`).join("")}</div><div class="card list">`;
  const rows = VERBS.filter(v => f === "alle" ? true : f === "schwach" ? isWeak(v.id) : v.prep === f);
  if (!rows.length) html += `<div class="empty">Nichts hier – keine schwachen Verben. Weiter so.</div>`;
  html += rows.map(v => `<div class="item"><span class="de">${esc(v.verb)} <b>${esc(v.prep)}</b> <span class="pill ${v.kase === "A" ? "akk" : "dat"}">${v.kase === "A" ? "Akk" : "Dat"}</span></span><span>${isWeak(v.id) ? '<span class="pill weak">schwach</span>' : isKnown(v.id) ? '<span class="pill ok">sicher</span>' : ""}</span><span class="en">${esc(v.en)} · ${woForm(v.prep)}? / ${daForm(v.prep)}</span><span class="ex">${esc(v.sentence.replace("___", v.prep))}</span></div>`).join("");
  return html + "</div>";
}
ACTIONS.vSub = a => { state.sub.verben = a; state.session = null; render(); };
ACTIONS.vFilter = a => { state.sub.vFilter = a; render(); };
ACTIONS.vStart = a => {
  const ids = buildSession(VERBS.map(v => v.id), 10, a === "weak");
  if (!ids.length) { toast("Keine schwachen Verben"); return; }
  state.session = { kind: "v", ids, i: 0, results: [], stage: "prep" }; state.sub.verben = "drill"; render();
};
ACTIONS.vCheck = () => {
  const s = state.session; if (!s || s.stage !== "prep") return;
  const inp = $("input.gap"); const given = inp ? inp.value : "";
  if (!given.trim()) { inp && inp.focus(); return; }
  const v = VERBS.find(x => x.id === s.ids[s.i]);
  s.given = given.trim(); s.prepOk = norm(given) === norm(v.prep); s.stage = "case"; render();
};
ACTIONS.vReveal = () => { const s = state.session; s.given = ""; s.prepOk = false; s.stage = "case"; render(); };
ACTIONS.vCase = a => {
  const s = state.session; if (!s || s.stage !== "case") return;
  const v = VERBS.find(x => x.id === s.ids[s.i]);
  s.caseOk = a === v.kase; s.stage = "fb";
  const ok = s.prepOk && s.caseOk; s.results.push({ id: v.id, ok }); recordAnswer(v.id, ok); render();
  const b = $("[data-act=vNext]"); if (b) b.focus();
};
ACTIONS.vNext = () => { const s = state.session; if (!s || s.stage !== "fb") return; s.i++; s.stage = "prep"; render(); };

function sessionSummary(s, restartAct, label) {
  const right = s.results.filter(r => r.ok).length, wrong = s.results.filter(r => !r.ok);
  return `<div class="card"><h2>Runde fertig</h2><div class="row" style="align-items:baseline;gap:14px"><span class="bignum">${right}/${s.results.length}</span><span class="muted">richtig</span></div>
    ${wrong.length ? `<h3>Nochmal anschauen</h3><ul class="phrases">${wrong.map(r => `<li>${label(r.id)}</li>`).join("")}</ul>` : `<p class="muted">Alles richtig. Die nächste Runde nimmt neue oder ältere Wörter.</p>`}
    <div class="row" style="margin-top:12px"><button class="btn" data-act="${restartAct}" data-arg="mix">Neue Runde</button>${wrong.length ? `<button class="btn ghost" data-act="${restartAct}" data-arg="weak">Nur schwache</button>` : ""}</div></div>`;
}

ACTIONS.wSub = a => { state.sub.woerter = a; state.session = null; render(); };

};
ACTIONS.wShow = () => { const s = state.session; if (!s || s.shown) return; s.shown = true; render(); };
ACTIONS.wGrade = a => { const s = state.session; if (!s || !s.shown) return; const ok = a === "1"; s.results.push({ id: s.ids[s.i], ok }); recordAnswer(s.ids[s.i], ok); s.i++; s.shown = false; render(); };

// ---------- GRAMMATIK ----------
VIEWS.grammatik = function () {
  const f = state.sub.gTopic || "alle";
  let html = `<div class="row" style="margin-bottom:10px">${["alle", "schwach", ...GTOPICS].map(t => `<button class="chip ${f === t ? "on" : ""}" data-act="gTopic" data-arg="${esc(t)}">${esc(t)}</button>`).join("")}</div>`;
  const pool = GRAMMAR.filter(g => f === "alle" ? true : f === "schwach" ? isWeak(g.id) : g.t === f);
  const s = state.session;
  if (!s || s.kind !== "g") {
    return html + `<div class="card"><h2>Grammatik</h2><p class="muted">Kurze Aufgaben mit Erklärung – genau die Strukturen, die in Sprachbausteinen und beim Schreiben Punkte bringen.</p>
      <p class="small muted">${pool.length} Aufgaben in dieser Auswahl.</p>
      <div class="row"><button class="btn" data-act="gStart" data-arg="mix">10 Aufgaben</button>${pool.some(g => isWeak(g.id)) ? `<button class="btn ghost" data-act="gStart" data-arg="weak">Nur schwache</button>` : ""}</div></div>`;
  }
  if (s.i >= s.ids.length) return html + sessionSummary(s, "gStart", id => { const g = GRAMMAR.find(x => x.id === id); return esc(g.q.replace("___", g.o[g.a])); });
  const g = GRAMMAR.find(x => x.id === s.ids[s.i]);
  html += `<div class="card drill"><div class="meta"><span>${s.i + 1} / ${s.ids.length}</span><span>${esc(g.t)}</span></div>`;
  const answered = s.picked != null;
  const q = g.q.includes("___") ? esc(g.q).replace(/___/g, answered ? `<span class="gapword right">${esc(g.o[g.a])}</span>` : "<span class=\"gapword\">&nbsp;&nbsp;&nbsp;&nbsp;</span>") : esc(g.q);
  html += `<div class="sentence">${q}</div><div class="opts">${s.order.map(idx => `<button data-act="gPick" data-arg="${idx}" ${answered ? "disabled" : ""} class="${answered && idx === g.a ? "right" : answered && idx === s.picked ? "wrong" : ""}">${esc(g.o[idx])}</button>`).join("")}</div>`;
  if (answered) html += `<div class="fb ${s.picked === g.a ? "good" : "bad"} explain">${esc(g.e)}</div><div class="row"><button class="btn" data-act="gNext" data-enter="gNext">Weiter</button></div>`;
  return html + "</div>";
};
ACTIONS.gTopic = a => { state.sub.gTopic = a; state.session = null; render(); };
ACTIONS.gStart = a => {
  const f = state.sub.gTopic || "alle";
  const pool = GRAMMAR.filter(g => f === "alle" || f === "schwach" ? true : g.t === f).map(g => g.id);
  const ids = buildSession(pool, 10, a === "weak" || f === "schwach");
  if (!ids.length) { toast("Keine schwachen Aufgaben"); return; }
  const g0 = GRAMMAR.find(x => x.id === ids[0]);
  state.session = { kind: "g", ids, i: 0, results: [], picked: null, order: shuffle(g0.o.map((_, i) => i)) }; render();
};
ACTIONS.gPick = a => {
  const s = state.session; if (!s || s.picked != null) return;
  const g = GRAMMAR.find(x => x.id === s.ids[s.i]); s.picked = Number(a);
  const ok = s.picked === g.a; s.results.push({ id: g.id, ok }); recordAnswer(g.id, ok); render();
  const b = $("[data-act=gNext]"); if (b) b.focus();
};
ACTIONS.gNext = () => { const s = state.session; if (!s || s.picked == null) return; s.i++; s.picked = null; const g = GRAMMAR.find(x => x.id === s.ids[s.i]); if (g) s.order = shuffle(g.o.map((_, i) => i)); render(); };

// ---------- REDEMITTEL ----------
VIEWS.redemittel = function () {
  const topic = state.sub.presTopic;
  let html = `<div class="card"><h2>Präsentation in fünf Schritten</h2><p class="muted">Sprechen Teil 2 hat immer dieselben fünf Folien. Lern die Sätze auswendig, dann musst du in der Prüfung nur noch das Thema einsetzen.</p>
    <ol class="steps">${PRES_STEPS.map(s => `<li><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></li>`).join("")}</ol>
    <hr class="divider"><div class="row between"><span>${topic ? `Dein Thema: <b class="kw">${esc(topic)}</b>` : "Zufallsthema zum Üben"}</span><button class="btn sm ghost" data-act="presTopic">${topic ? "Anderes Thema" : "Thema ziehen"}</button></div></div>`;
  html += REDEMITTEL.map((r, i) => `<div class="card"><h2>${esc(r.part)}</h2><p class="muted small" style="margin-bottom:4px">${esc(r.title)} – ${esc(r.info)}</p>
    ${r.groups.map((g, j) => `<details ${i === 1 && j === 0 ? "open" : ""}><summary>${esc(g[0])}</summary><ul class="phrases">${g[1].map(p => `<li>${nl(p)}</li>`).join("")}</ul></details>`).join("")}</div>`).join("");
  return html;
};
ACTIONS.presTopic = () => { const cur = state.sub.presTopic; let t; do { t = PRES_TOPICS[Math.floor(Math.random() * PRES_TOPICS.length)]; } while (t === cur && PRES_TOPICS.length > 1); state.sub.presTopic = t; render(); };

// ---------- SCHREIBEN (Claude-Check) ----------
const TEXT_KINDS = {
  email1: { label: "Informelle E-Mail (Teil 1)", brief: "Schreiben Teil 1: informelle E-Mail an eine Freundin / einen Freund, ca. 80 Wörter, drei Inhaltspunkte müssen behandelt werden, mit Anrede und Gruß." },
  meinung: { label: "Meinung / Forumsbeitrag (Teil 2)", brief: "Schreiben Teil 2: Beitrag in einem Gästebuch oder Forum zu einer Sendung, ca. 80 Wörter, eigene Meinung mit Begründung und Beispiel." },
  email3: { label: "Halbformelle E-Mail (Teil 3)", brief: "Schreiben Teil 3: halbformelle E-Mail (an eine Lehrerin, einen Chef, eine Firma), ca. 40 Wörter, höflich, Sie-Form, alle Inhaltspunkte, mit passender Anrede und Grußformel." },
  pres: { label: "Präsentation (Sprechen Teil 2)", brief: "Sprechen Teil 2: Präsentation zu einem Thema, ca. 3 Minuten, mit den fünf Teilen: Thema vorstellen, persönliche Erfahrung, Situation im Heimatland, Vor- und Nachteile, Meinung und Abschluss." }
};
VIEWS.schreiben = function () {
  const mode = state.sub.sMode || "satz";
  let html = `<div class="tabs2"><button class="chip ${mode === "satz" ? "on" : ""}" data-act="sMode" data-arg="satz">Satz mit Wort</button><button class="chip ${mode === "text" ? "on" : ""}" data-act="sMode" data-arg="text">Text korrigieren</button></div>`;
  if (!state.sample) {
    html += `<div class="fb note small">${state.sampleTried ? "Der Claude-Check ist in dieser Ansicht nicht verfügbar. Schreib deinen Satz oder Text trotzdem hier und kopiere ihn dann in den Chat – dort korrigiere ich ihn." : "Verbinde mit Claude …"}</div>`;
  }
  if (mode === "satz") {
    const it = state.sub.sItem || pickWritingItem();
    state.sub.sItem = it;
    html += `<div class="card"><h2>Schreib einen Satz mit …</h2>
      <div class="sentence">${esc(it.label)}</div><div class="hint">${esc(it.en)}${it.topic ? " · " + esc(it.topic) : ""}</div>
      <textarea id="sIn" placeholder="Dein Satz …" style="min-height:90px">${esc(state.sub.sText || "")}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="sCheck" ${state.sample ? "" : "disabled"}>Prüfen lassen</button><button class="btn ghost" data-act="sNew">Anderes Wort</button></div>
      <div id="sOut" style="margin-top:12px"></div></div>`;
    return html;
  }
  const kind = state.sub.tKind || "email1";
  html += `<div class="card"><h2>Text korrigieren</h2><p class="muted small">Schreib wie in der Prüfung – ohne Wörterbuch, mit Zeitlimit. Dann bekommst du den korrigierten Text, die wichtigsten Fehler mit Erklärung und eine Einschätzung nach den Goethe-Kriterien.</p>
    <div class="row" style="margin-bottom:8px"><select id="tKind" data-act="tKind">${Object.keys(TEXT_KINDS).map(k => `<option value="${k}" ${k === kind ? "selected" : ""}>${esc(TEXT_KINDS[k].label)}</option>`).join("")}</select></div>
    ${kind === "pres" ? `<div class="row" style="margin-bottom:8px"><span class="small muted">Thema: ${esc(state.sub.presTopic || "(zieh eins unter Redemittel)")}</span></div>` : ""}
    <textarea id="tIn" placeholder="${kind === "pres" ? "Schreib deine Präsentation so auf, wie du sie sprechen würdest …" : "Dein Text …"}">${esc(state.sub.tText || "")}</textarea>
    <div class="row between" style="margin-top:10px"><div class="row"><button class="btn" data-act="tCheck" ${state.sample ? "" : "disabled"}>Korrigieren</button><button class="btn ghost" data-act="tStop" id="tStop" hidden>Stopp</button></div><span class="small muted" id="wc"></span></div>
    <div id="tOut" class="out" style="margin-top:12px"></div></div>`;
  setTimeout(updateWc, 0);
  return html;
};
function pickWritingItem() {
  const useVerb = Math.random() < 0.55;
  if (useVerb) { const v = VERBS[Math.floor(Math.random() * VERBS.length)]; return { id: v.id, label: `${v.verb} ${v.prep} + ${v.kase === "A" ? "Akk" : "Dat"}`, en: v.en, ex: v.sentence.replace("___", v.prep) }; }
  const w = VOCAB[Math.floor(Math.random() * VOCAB.length)]; return { id: w.id, label: w.de, en: w.en, topic: w.topic, ex: w.ex.replace(/\*/g, "") };
}
function updateWc() { const t = $("#tIn"), w = $("#wc"); if (!t || !w) return; const n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0; w.textContent = n + " Wörter"; }
document.addEventListener("input", e => { if (e.target.id === "tIn") { state.sub.tText = e.target.value; updateWc(); } if (e.target.id === "sIn") state.sub.sText = e.target.value; });
document.addEventListener("change", e => { if (e.target.id === "tKind") { state.sub.tKind = e.target.value; render(); } });
ACTIONS.sMode = a => { state.sub.sMode = a; render(); };
ACTIONS.sNew = () => { state.sub.sItem = pickWritingItem(); state.sub.sText = ""; render(); };
function errCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled") { state.sample = null; return "Der Claude-Check ist für diese Ansicht nicht erlaubt. Kopiere den Text in den Chat."; }
  if (c === "rate_limited") return "Zu viele Anfragen gerade – versuch es in ein paar Minuten noch einmal.";
  if (c === "cancelled") return "";
  if (c === "refused") return "Dieser Text konnte nicht geprüft werden. Formuliere ihn anders.";
  if (c === "invalid_json") return "Die Antwort war unvollständig. Bitte noch einmal auf „Prüfen lassen“ tippen.";
  return "Die Verbindung ist abgebrochen. Bitte noch einmal versuchen.";
}
ACTIONS.sCheck = async () => {
  const s = state.sample; if (!s) return;
  const it = state.sub.sItem; const text = ($("#sIn") || {}).value || "";
  if (!text.trim()) { toast("Erst einen Satz schreiben"); return; }
  const out = $("#sOut"); const btn = $("[data-act=sCheck]");
  out.innerHTML = `<div class="fb note">Wird geprüft …</div>`; btn.disabled = true;
  const prompt = `Du bist ein erfahrener Deutschlehrer und bereitest einen Lernenden auf das Goethe-Zertifikat B1 vor. Der Lernende sollte einen eigenen Satz mit „${it.label}“ schreiben (Bedeutung: ${it.en}).
Satz des Lernenden: "${text.trim()}"
Prüfe: Ist der Satz grammatisch korrekt (Wortstellung, Kasus, Endungen, Präposition) und ist „${it.label}“ richtig und sinnvoll verwendet? Falsche Groß-/Kleinschreibung zählt als Fehler.
Antworte NUR mit einem JSON-Objekt: {"correct": true oder false, "corrected": "der korrigierte Satz (oder unverändert, wenn korrekt)", "note": "1-2 short sentences in English: what was wrong and why, or what is good", "better": "optional: eine natürlichere B1-Formulierung, sonst leerer String"}`;
  try {
    const r = await s.json(prompt, { modelTier: "quick" });
    const ok = !!(r && r.correct);
    state.progress.writes = (state.progress.writes || 0) + 1; recordAnswer(it.id, ok);
    out.innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><div class="big">${esc(r.corrected || text)}</div><div>${esc(r.note || "")}</div>${r.better && r.better.trim() && r.better.trim() !== (r.corrected || "").trim() ? `<div class="small muted" style="margin-top:6px">Natürlicher: <i>${esc(r.better)}</i></div>` : ""}<div class="small muted" style="margin-top:6px">Beispiel: <i>${esc(it.ex)}</i></div></div><div class="row"><button class="btn" data-act="sNew">Nächstes Wort</button></div>`;
  } catch (e) { const m = errCopy(e); out.innerHTML = m ? `<div class="fb bad">${esc(m)}</div>` : ""; }
  finally { btn.disabled = !state.sample; }
};
ACTIONS.tKind = () => {};
ACTIONS.tStop = () => { if (state.ctl) state.ctl.abort(); };
ACTIONS.tCheck = async () => {
  const s = state.sample; if (!s) return;
  const kind = state.sub.tKind || "email1"; const text = ($("#tIn") || {}).value || "";
  if (text.trim().split(/\s+/).length < 8) { toast("Der Text ist noch sehr kurz"); return; }
  const out = $("#tOut"); const btn = $("[data-act=tCheck]"); const stop = $("#tStop");
  out.textContent = "Wird gelesen … (das dauert bis zu einer Minute)"; btn.disabled = true; stop.hidden = false;
  state.ctl = new AbortController();
  const topicLine = kind === "pres" && state.sub.presTopic ? `Thema der Präsentation: „${state.sub.presTopic}“.\n` : "";
  const prompt = `Du bist Prüfer für das Goethe-Zertifikat B1. Ein Lernender (Muttersprache: nicht Deutsch, Niveau B1, Prüfung in wenigen Tagen) hat folgende Aufgabe bearbeitet.
Aufgabe: ${TEXT_KINDS[kind].brief}
${topicLine}Text des Lernenden:
"""
${text.trim().slice(0, 6000)}
"""
Gib Feedback in genau diesem Aufbau, ohne Markdown-Überschriften mit #, nur nummerierte Abschnitte:
1. Korrigierter Text – der ganze Text mit allen Korrekturen, bleib so nah wie möglich am Original.
2. Fehler und Erklärungen – höchstens 8 wichtigste Punkte, je eine Zeile: „falsch → richtig – kurze Erklärung auf Englisch“.
3. Bewertung nach Goethe-Kriterien – je ein Satz zu: Erfüllung der Aufgabe (alle Punkte? Länge? Textsorte?), Kohärenz (Verknüpfung, Konnektoren), Wortschatz, Strukturen (Nebensätze, Kasus, Konjunktiv II …).
4. Zwei konkrete Tipps für die nächste Version.
5. Einschätzung – reicht das für B1? Ein Satz.
Sei ehrlich, aber ermutigend. Erklärungen kurz und auf Englisch, alles andere auf Deutsch.`;
  try {
    const r = await s(prompt, { signal: state.ctl.signal, onText: ({ text }) => { out.textContent = text; }, cache: false });
    out.textContent = r.text + (r.truncated ? "\n\n(Die Antwort wurde gekürzt – nächstes Mal einen kürzeren Text schicken.)" : "");
    state.progress.writes = (state.progress.writes || 0) + 1; touch();
  } catch (e) { const m = errCopy(e); out.textContent = (e && e.text ? e.text + "\n\n" : "") + m; }
  finally { btn.disabled = !state.sample; stop.hidden = true; state.ctl = null; }
};

// ---------- STAND ----------
VIEWS.stand = function () {
  const p = state.progress;
  const mods = [["Verben + Präpositionen", VERBS.map(v => v.id)], ["Wörter", VOCAB.map(w => w.id)], ["Grammatik", GRAMMAR.map(g => g.id)]];
  const dayKeys = Object.keys(p.days).sort();
  let streak = 0; { const d = new Date(); for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (p.days[k]) { streak++; d.setDate(d.getDate() - 1); } else if (k === todayKey()) { d.setDate(d.getDate() - 1); } else break; if (streak > 400) break; } }
  const today = p.days[todayKey()] || { n: 0, r: 0 };
  const total = dayKeys.reduce((a, k) => a + p.days[k].n, 0);
  let html = `<div class="card"><div class="row" style="gap:24px;align-items:flex-start"><div><div class="bignum">${daysLeft()}</div><div class="muted small">Tage bis zur Prüfung</div></div><div><div class="bignum">${today.n}</div><div class="muted small">Antworten heute</div></div><div><div class="bignum">${streak}</div><div class="muted small">Tage in Folge</div></div></div>
    <hr class="divider"><div class="row"><label class="small muted" for="examDate">Prüfungsdatum</label><input type="date" id="examDate" value="${esc(p.examDate || DEFAULT_EXAM)}"></div></div>`;
  html += `<div class="card"><h2>Module</h2>`;
  html += mods.map(m => {
    const ids = m[1]; const seen = ids.filter(id => stat(id)).length; const known = ids.filter(isKnown).length; const weak = ids.filter(isWeak).length;
    const c = ids.reduce((a, id) => a + (stat(id) ? stat(id).c : 0), 0), w = ids.reduce((a, id) => a + (stat(id) ? stat(id).w : 0), 0);
    const acc = c + w ? Math.round(100 * c / (c + w)) : 0;
    return `<div class="stat"><span>${m[0]}<br><span class="small muted">${seen} von ${ids.length} gesehen · ${known} sicher · ${weak} schwach</span></span><span class="n">${c + w ? acc + "%" : "–"}</span><div class="bar"><i style="width:${Math.round(100 * known / ids.length)}%"></i></div></div>`;
  }).join("");
  html += `<p class="small muted" style="margin-top:10px">Balken = Anteil „sicher“ (mindestens zweimal richtig, zuletzt richtig). Insgesamt ${total} Antworten, ${p.writes || 0} Texte und Sätze geprüft.</p></div>`;
  const weakV = VERBS.filter(v => isWeak(v.id)), weakW = VOCAB.filter(w => isWeak(w.id)), weakG = GRAMMAR.filter(g => isWeak(g.id));
  html += `<div class="card"><h2>Schwache Stellen</h2>`;
  if (!weakV.length && !weakW.length && !weakG.length) html += `<p class="muted">Noch nichts – oder alles sitzt. Nach ein paar Runden erscheint hier, was du wiederholen solltest.</p>`;
  if (weakV.length) html += `<h3>Verben (${weakV.length})</h3><ul class="phrases">${weakV.slice(0, 12).map(v => `<li>${esc(v.verb)} <b>${esc(v.prep)}</b> + ${v.kase === "A" ? "Akk" : "Dat"}</li>`).join("")}</ul><button class="btn sm" data-act="goDrill" data-arg="v">Schwache Verben üben</button>`;
  if (weakW.length) html += `<h3>Wörter (${weakW.length})</h3><ul class="phrases">${weakW.slice(0, 12).map(w => `<li>${esc(w.de)} – ${esc(w.en)}</li>`).join("")}</ul><button class="btn sm" data-act="goDrill" data-arg="w">Schwache Wörter üben</button>`;
  if (weakG.length) html += `<h3>Grammatik (${weakG.length})</h3><ul class="phrases">${weakG.slice(0, 12).map(g => `<li>${esc(g.t)}: ${esc(g.q.replace("___", g.o[g.a]))}</li>`).join("")}</ul><button class="btn sm" data-act="goDrill" data-arg="g">Schwache Aufgaben üben</button>`;
  html += `</div><div class="card"><h2>Plan bis zur Prüfung</h2><ol class="steps">
    <li><div><b>Jeden Tag</b><span>10 Verben, 10 Wörter, 10 Grammatikaufgaben – zuerst die schwachen.</span></div></li>
    <li><div><b>Jeden Tag ein Text</b><span>Abwechselnd E-Mail, Forumsbeitrag, formelle E-Mail – unter „Schreiben“ prüfen lassen, dann einmal neu schreiben.</span></div></li>
    <li><div><b>Alle zwei Tage sprechen</b><span>Thema ziehen, 3 Minuten mit dem Handy aufnehmen, anhören, unter „Schreiben → Präsentation“ Feedback holen.</span></div></li>
    <li><div><b>Letzte 5 Tage</b><span>Modelltests von goethe.de mit Zeit. Die letzten zwei Tage nur Redemittel und schwache Stellen.</span></div></li></ol>
    <hr class="divider"><div class="row"><button class="btn ghost sm" data-act="reset">Fortschritt zurücksetzen</button></div></div>`;
  return html;
};
document.addEventListener("change", e => { if (e.target.id === "examDate" && e.target.value) { state.progress.examDate = e.target.value; touch(); renderHead(); toast("Datum gespeichert"); } });
ACTIONS.goDrill = a => { if (a === "v") { state.tab = "verben"; ACTIONS.vStart("weak"); } else if (a === "w") { state.tab = "woerter"; state.sub.wTopic = "alle"; ACTIONS.wStart("weak"); } else { state.tab = "grammatik"; state.sub.gTopic = "alle"; ACTIONS.gStart("weak"); } window.scrollTo(0, 0); };
ACTIONS.reset = () => { if (!confirm("Wirklich den ganzen Fortschritt löschen?")) return; const ed = state.progress.examDate; state.progress = freshProgress(); state.progress.examDate = ed; touch(); render(); toast("Zurückgesetzt"); };

render();
</script>
